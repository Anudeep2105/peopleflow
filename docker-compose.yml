services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peopleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      POSTGRES_DB: peopleflow
    volumes: [peopleflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleflow -d peopleflow"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://peopleflow:${POSTGRES_PASSWORD:-change_me_now}@db:5432/peopleflow?schema=public
    ports: ["127.0.0.1:3001:3000"]
    volumes: [peopleflow-uploads:/app/private-uploads]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 10
  attendance-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://peopleflow:${POSTGRES_PASSWORD:-change_me_now}@db:5432/peopleflow?schema=public
    command: ["npm", "run", "worker:attendance"]
    volumes: [peopleflow-uploads:/app/private-uploads]
    depends_on:
      app: { condition: service_healthy }
volumes:
  peopleflow-db:
  peopleflow-uploads:
